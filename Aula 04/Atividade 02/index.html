<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02 - Tabuada</title>
</head>
<body>
    <h1>Tabuada</h1>
    <form id="formulario">
        <label for="numero">Informe um número inteiro de 1 a 10:</label>
        <input type="number" id="numero" min="1" max="10" step="1" required>
        <button type="submit">Mostrar tabuada</button>
    </form>
    <p id="resultado" aria-live="polite"></p>

    <script>
        document.getElementById("formulario").addEventListener("submit", function (evento) {
            evento.preventDefault();

            let numero = Number(document.getElementById("numero").value);
            let resultado = document.getElementById("resultado");

            if (!Number.isInteger(numero) || numero < 1 || numero > 10) {
                resultado.textContent = "Informe um número inteiro de 1 a 10.";
                return;
            }

            // Monta a tabuada do número informado usando um laço FOR.
            let texto = "";
            for (let multiplicador = 1; multiplicador <= 10; multiplicador++) {
                texto += numero + " x " + multiplicador + " = " + (numero * multiplicador) + "<br>";
            }
            resultado.innerHTML = texto;
        });
    </script>
</body>
</html>
