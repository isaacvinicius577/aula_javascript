<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
</head>
<body>
    <h1>Calculadora de IMC</h1>

    <form onsubmit="calcularIMC(event)">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" min="0" step="any" placeholder="Ex.: 70" required>
        <br><br>

        <label for="altura">Altura (metros):</label>
        <input type="number" id="altura" min="0" step="any" placeholder="Ex.: 1,75" required>
        <br><br>

        <button type="submit">Calcular IMC</button>
    </form>

    <p id="resultado" aria-live="polite"></p>

    <script>
        function calcularIMC(event) {
            event.preventDefault();

            const peso = Number(document.getElementById("peso").value);
            const altura = Number(document.getElementById("altura").value);
            const resultado = document.getElementById("resultado");

            if (!Number.isFinite(peso) || !Number.isFinite(altura) || peso <= 0 || altura <= 0) {
                resultado.textContent = "Informe peso e altura maiores que zero.";
                return;
            }

            const imc = peso / (altura * altura);
            resultado.textContent = "Seu IMC é: " + imc.toFixed(2).replace(".", ",");
        }
    </script>
</body>
</html>
